services:
  jieshan:
    image: ${JIESHAN_IMAGE:-ghcr.io/lutiantian001/jieshan:latest}
    container_name: jieshan
    restart: unless-stopped
    init: true
    ports:
      - "${JIESHAN_BIND_IP:-127.0.0.1}:${JIESHAN_PORT:-4000}:4000"
    environment:
      JIESHAN_LISTEN_ADDR: ":4000"
      JIESHAN_DATA_DIR: /data
      JIESHAN_DB_PATH: /data/jieshan.db
      JIESHAN_WEB_DIR: /app/web
      JIESHAN_ADMIN_PASSWORD: ${JIESHAN_ADMIN_PASSWORD:?set JIESHAN_ADMIN_PASSWORD in .env}
      JIESHAN_SECRET_KEY: ${JIESHAN_SECRET_KEY:?set JIESHAN_SECRET_KEY in .env}
      JIESHAN_LOG_LEVEL: ${JIESHAN_LOG_LEVEL:-info}
      JIESHAN_TRUST_PROXY: ${JIESHAN_TRUST_PROXY:-true}
      JIESHAN_ALLOW_PRIVATE_UPSTREAMS: ${JIESHAN_ALLOW_PRIVATE_UPSTREAMS:-false}
      JIESHAN_SESSION_TTL: ${JIESHAN_SESSION_TTL:-24h}
      JIESHAN_UPSTREAM_TIMEOUT: ${JIESHAN_UPSTREAM_TIMEOUT:-60s}
      GOMEMLIMIT: ${JIESHAN_GO_MEMORY_LIMIT:-480MiB}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - jieshan-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${JIESHAN_MEMORY_LIMIT:-640m}
    memswap_limit: ${JIESHAN_MEMORY_SWAP_LIMIT:-768m}
    mem_reservation: 256m
    cpus: ${JIESHAN_CPU_LIMIT:-1.5}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  jieshan-data:
    name: jieshan-data
